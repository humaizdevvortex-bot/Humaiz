<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2f" />
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow-fx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Hexagonal Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#grad-shield)" stroke="#f97316" stroke-width="2.5" stroke-opacity="0.6" />
  
  <!-- Subtle Inner Border -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#fed7aa" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Monogram HU stylized -->
  <!-- Letter H -->
  <path d="M16 18 V46 M28 18 V46 M16 32 H28" stroke="url(#grad-gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Letter U -->
  <path d="M36 18 V38 C36 43 40 46 45 46 C50 46 54 43 54 38 V18" stroke="url(#grad-gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Online Green Status Node -->
  <circle cx="52" cy="12" r="3.5" fill="#22c55e" filter="url(#glow-fx)" />
  <circle cx="52" cy="12" r="1.5" fill="#ffffff" />
</svg>
